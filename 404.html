<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to inFlow Premium...</title>
    <script>
        // GitHub Pages SPA / 404 Redirect Handler
        var path = window.location.pathname;
        if (path.indexOf('login') !== -1) {
            window.location.replace('login.html');
        } else {
            window.location.replace('index.html');
        }
    </script>
</head>
<body style="font-family: sans-serif; background: #0F172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2 style="margin-bottom: 8px;">Loading inFlow Premium...</h2>
        <p style="color: #94A3B8;">Redirecting to <a href="login.html" style="color: #38BDF8;">Sign In Page</a></p>
    </div>
</body>
</html>
