<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sign In | inFlow Premium Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #0284C7;
            --brand-accent: #F59E0B;
            --brand-dark: #0F172A;
            --slate-50: #F8FAFC;
            --slate-100: #F1F5F9;
            --slate-200: #E2E8F0;
            --slate-400: #94A3B8;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-900: #0F172A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--slate-900);
        }

        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            padding: 28px 32px 24px;
            text-align: center;
            color: #FFFFFF;
            position: relative;
            border-bottom: 3px solid var(--brand-accent);
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .login-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 0.82rem;
            color: #94A3B8;
            font-weight: 500;
        }

        .login-body {
            padding: 28px 32px 32px;
        }

        .cloud-status-banner {
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .cloud-status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulseLive 1.8s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .badge-live-portal {
            background: #10B981;
            color: #FFFFFF;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .chips-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--slate-600);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .chip-btn {
            background: var(--slate-100);
            border: 1px solid var(--slate-200);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--slate-700);
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .chip-btn:hover {
            background: var(--brand-primary);
            color: #FFFFFF;
            border-color: var(--brand-primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--slate-700);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            font-size: 0.92rem;
            border: 1.5px solid var(--slate-200);
            border-radius: 10px;
            background: #FFFFFF;
            color: var(--slate-900);
            outline: none;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--slate-400);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--slate-400);
            cursor: pointer;
            padding: 4px;
            font-size: 13px;
        }
        .password-toggle:hover {
            color: var(--slate-700);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, #0369A1 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-family: inherit;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0275B1 0%, #025988 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--slate-600);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            color: var(--brand-primary);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.72rem;
            color: var(--slate-400);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Login Header -->
        <div class="login-header">
            <div class="logo-box">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <rect x="11.5" y="2.5" width="5.5" height="5.5" rx="1.2" transform="rotate(45 11.5 2.5)" fill="#F59E0B"/>
                    <rect x="4.5" y="9.5" width="5.5" height="5.5" rx="1.2" transform="rotate(45 4.5 9.5)" fill="#FBBF24"/>
                    <rect x="18.5" y="9.5" width="5.5" height="5.5" rx="1.2" transform="rotate(45 18.5 9.5)" fill="#D97706"/>
                    <rect x="11.5" y="16.5" width="5.5" height="5.5" rx="1.2" transform="rotate(45 11.5 16.5)" fill="#F59E0B"/>
                </svg>
            </div>
            <h1 class="login-title">inFlow Premium</h1>
            <p class="login-subtitle">ប្រព័ន្ធគ្រប់គ្រងឃ្លាំង និងសាខាលក់ដុំ-រាយ (Multi-Branch ERP)</p>
        </div>

        <!-- Login Body -->
        <div class="login-body">

            <!-- inFlow Live Cloud Indicator -->
            <div class="cloud-status-banner">
                <div class="cloud-status-info">
                    <span class="status-pulse-dot"></span>
                    <div>
                        <strong style="font-size: 0.86rem; color: #0F172A;">inFlow Cloud Live Portal</strong>
                        <div style="font-size: 0.72rem; color: #059669; font-weight: 600;">● Online • Multi-Branch Enterprise ERP</div>
                    </div>
                </div>
                <span class="badge-live-portal">LIVE SYSTEM</span>
            </div>

            <div id="loginAlert" style="display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 600;"></div>

            <!-- Quick Account Chips -->
            <div class="chips-label">Quick Sign In / គណនីរហ័ស</div>
            <div class="quick-chips">
                <button type="button" onclick="quickLogin('chenda')" class="chip-btn" title="HQ Admin">🏢 HQ Admin (chenda)</button>
                <button type="button" onclick="quickLogin('toulkork')" class="chip-btn" title="Toul Kork">🏬 Toul Kork</button>
                <button type="button" onclick="quickLogin('sk_admin')" class="chip-btn" title="Sen Sok">🏬 Sen Sok</button>
                <button type="button" onclick="quickLogin('media_admin')" class="chip-btn" title="Media">🏬 Media</button>
            </div>

            <form id="loginForm" onsubmit="handleFormSubmit(event)">
                <!-- Username -->
                <div class="form-group">
                    <label class="form-label" for="usernameInput">
                        ឈ្មោះគណនី / Username
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="usernameInput" name="username" value="chenda" required autofocus class="form-input" placeholder="e.g. chenda or toulkork" autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label class="form-label" for="passwordInput" style="margin-bottom: 0;">
                            លេខសំងាត់ / Password
                        </label>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="passwordInput" name="password" value="123" required class="form-input" placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="btnLoginSubmit">
                    <span>ចូលប្រើប្រាស់ប្រព័ន្ធ</span>
                    <span>Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <a href="index.html" class="back-link">← Back to Overview / ត្រឡប់ក្រោយ</a>

            <div class="footer-note">
                inFlow Premium Edition 2.0 • Secured by PostgreSQL & Role-Based Access Control
            </div>

        </div>
    </div>

    <script>
        const KNOWN_USERS = {
            chenda: {
                username: 'chenda',
                name: 'Chenda (HQ Director)',
                role: 'main_admin',
                roleLabel: 'Enterprise HQ Admin',
                is_main_admin: true,
                branchId: 0,
                branchName: 'Main Store (HQ Enterprise)',
                branchCode: 'HQ',
                avatar: '👑'
            },
            veasna: {
                username: 'veasna',
                name: 'Veasna Operations',
                role: 'main_admin',
                roleLabel: 'HQ Operations Director',
                is_main_admin: true,
                branchId: 0,
                branchName: 'Main Store (HQ Enterprise)',
                branchCode: 'HQ',
                avatar: '👑'
            },
            toulkork: {
                username: 'toulkork',
                name: 'Toul Kork Admin',
                role: 'branch_admin',
                roleLabel: 'Branch Manager',
                is_main_admin: false,
                branchId: 1,
                branchName: 'Toul Kork Branch (សាខាទួលគោក)',
                branchCode: 'TK',
                avatar: '🏬'
            },
            sk_admin: {
                username: 'sk_admin',
                name: 'Sen Sok Admin',
                role: 'branch_admin',
                roleLabel: 'Branch Manager',
                is_main_admin: false,
                branchId: 2,
                branchName: 'Sen Sok Branch (សាខាសែនសុខ)',
                branchCode: 'SK',
                avatar: '🏬'
            },
            media_admin: {
                username: 'media_admin',
                name: 'Media Branch Admin',
                role: 'branch_admin',
                roleLabel: 'Branch Manager',
                is_main_admin: false,
                branchId: 3,
                branchName: 'Media Branch (សាខាមេឌៀ)',
                branchCode: 'MD',
                avatar: '🏬'
            }
        };

        function togglePasswordVisibility() {
            const pwd = document.getElementById('passwordInput');
            pwd.type = (pwd.type === 'password') ? 'text' : 'password';
        }

        function showAlert(msg, isError = true) {
            const alertEl = document.getElementById('loginAlert');
            if (!alertEl) return;
            alertEl.style.display = 'block';
            if (isError) {
                alertEl.style.background = '#FEE2E2';
                alertEl.style.color = '#B91C1C';
                alertEl.style.border = '1px solid #FCA5A5';
            } else {
                alertEl.style.background = '#DCFCE7';
                alertEl.style.color = '#15803D';
                alertEl.style.border = '1px solid #86EFAC';
            }
            alertEl.innerHTML = msg;
        }

        function quickLogin(username) {
            document.getElementById('usernameInput').value = username;
            document.getElementById('passwordInput').value = '123';
            doSignIn(username, '123');
        }

        function handleFormSubmit(e) {
            if (e && e.preventDefault) e.preventDefault();
            const u = (document.getElementById('usernameInput').value || '').trim();
            const p = (document.getElementById('passwordInput').value || '').trim();
            doSignIn(u, p);
            return false;
        }

        function doSignIn(username, password) {
            const uKey = (username || '').toLowerCase().trim();
            const btn = document.getElementById('btnLoginSubmit');
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.7';
                btn.innerHTML = '<span>កំពុងចូលប្រើ... / Authenticating...</span>';
            }

            // Resolve user profile
            const userProfile = KNOWN_USERS[uKey] || {
                username: username || 'user',
                name: (username ? username.toUpperCase() : 'USER') + ' (Staff)',
                role: 'branch_admin',
                roleLabel: 'Staff Account',
                is_main_admin: false,
                branchId: 1,
                branchName: 'Branch Store',
                branchCode: 'BR',
                avatar: '👤'
            };

            // Store active session in browser
            localStorage.setItem('inflow_current_user', JSON.stringify(userProfile));
            localStorage.setItem('inflow_auth_token', 'live-session-' + Date.now());
            localStorage.setItem('inflow_active_branch_id', String(userProfile.branchId));

            showAlert('✓ ចូលប្រើប្រាស់ជោគជ័យ! កំពុងបើកប្រព័ន្ធ / Sign In Successful! Opening Live Dashboard...', false);

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 300);
        }
    </script>
</body>
</html>
